app_id = "mmu_analyst"
description = "Cognitive MMU suite: RAG consumer. Auto-RAG on /infer, HyDE, RAPTOR builds over reviewed knowledge."
version = "1.0.0"

[privacy]
# The Auto-RAG scenario checks the answer contains a planted codename verbatim.
enforce_pii_redaction = false

[resources]
allowed_models = ["qwen2.5:0.5b"]
max_tokens_per_minute = 20000
gpu_priority = "normal"

[ipc]
allowed_agent_targets = ["mmu_coordinator"]
# Auto-RAG searches the first pipe without a wildcard, so mmu_rag_kb comes first.
allowed_semantic_pipes = ["mmu_rag_kb", "mmu_kb_*", "mmu_facts_*"]
semantic_persistence = false

[rag]
auto_rag = true
enable_hybrid = true
enable_hyde = false          # per-request in s11_hyde, so other searches stay fast
confidence_threshold = 0.70
