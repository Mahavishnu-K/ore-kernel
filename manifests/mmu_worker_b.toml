app_id = "mmu_worker_b"
description = "Cognitive MMU suite: second worker; plays the compromised agent in the swarm scenario."
version = "1.0.0"

[privacy]
enforce_pii_redaction = true

[resources]
allowed_models = []
max_tokens_per_minute = 1000
gpu_priority = "normal"

[ipc]
allowed_agent_targets = ["mmu_coordinator", "mmu_reviewer"]
# Branches only: mmu_kb_* (reviewed knowledge) is deliberately absent.
allowed_semantic_pipes = ["mmu_br_*", "mmu_facts_*"]
semantic_persistence = false
