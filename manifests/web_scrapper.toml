app_id = "web_scrapper"
description = "Generated by ORE CLI"
version = "1.0.0"

[privacy]
enforce_pii_redaction = true

[resources]
allowed_models = ["mistral-3-3b"]
max_tokens_per_minute = 10000
gpu_priority = "normal"

[network]
network_enabled = true
allow_localhost_access = false

[[network.rules]]
domain = "jsonplaceholder.typicode.com"
allowed_methods = ["GET"]
allowed_paths = ["*"]

[[network.rules]]
domain = "linux-foundation.org"
allowed_methods = ["GET"]
allowed_paths = ["*"]

[ipc]
allowed_ipc_targets = []

[execution]
can_execute_shell = false
can_execute_wasm = true
allowed_tools = ["network_interception"]

