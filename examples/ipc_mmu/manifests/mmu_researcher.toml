app_id = "mmu_researcher"
description = "Cognitive MMU suite: gathers tiered facts into the shared mmu_facts_* pipes."
version = "1.0.0"

[privacy]
enforce_pii_redaction = true

[resources]
allowed_models = []
max_tokens_per_minute = 1000
gpu_priority = "normal"

[ipc]
allowed_agent_targets = ["mmu_coordinator"]
allowed_semantic_pipes = ["mmu_facts_*"]
semantic_persistence = false
