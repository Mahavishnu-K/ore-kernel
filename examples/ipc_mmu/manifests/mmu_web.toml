app_id = "mmu_web"
description = "Cognitive MMU suite: web researcher. Searches Wikipedia and DuckDuckGo through POST /net/fetch and keeps findings in mmu_web_* pipes."
version = "1.0.0"

[privacy]
enforce_pii_redaction = true

[resources]
allowed_models = []
max_tokens_per_minute = 1000
gpu_priority = "low"

# Exactly two read-only search APIs. The kernel checks every request and
# every redirect hop against these rules; anything else is a 403.
[network]
network_enabled = true
allow_localhost_access = false

[[network.rules]]
domain = "en.wikipedia.org"
allowed_methods = ["GET"]
allowed_paths = ["/w/api.php"]

[[network.rules]]
domain = "api.duckduckgo.com"
allowed_methods = ["GET"]
allowed_paths = ["/"]

[ipc]
allowed_agent_targets = []
allowed_semantic_pipes = ["mmu_web_*"]
semantic_persistence = false
